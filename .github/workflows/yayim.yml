name: Yayım
on:
  push:
    tags: ['v*']
# İş akışının belirteci yalnız okur. Depoya yalnız sürümü yayımlayan son iş yazar: O iş depoyu çekmez, npm'i ve deponun
# kodunu çalıştırmaz, paketi ve notu ilk işin çıktısından alır.
permissions:
  contents: read
jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Etiket manifest sürümüyle aynı mı
        run: node -e "const v=require('./manifest.json').version; if ('v'+v !== process.env.GITHUB_REF_NAME) { console.error('manifest '+v+' ile etiket '+process.env.GITHUB_REF_NAME+' tutmuyor'); process.exit(1); }"
      - run: node araclar/paketle.mjs cikti/UDF-On-Izleme.zip
      - name: Sürüm notu
        run: node araclar/surum-notu.mjs "${GITHUB_REF_NAME#v}" > cikti/not.md
      - uses: actions/upload-artifact@v4
        with:
          name: paket
          path: cikti/
          retention-days: 1
          if-no-files-found: error
  yayim:
    needs: paket
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paket
          path: cikti
      - name: Sürümü yayımla
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" cikti/UDF-On-Izleme.zip --title "UDF Ön İzleme ${GITHUB_REF_NAME#v}" --notes-file cikti/not.md --latest
