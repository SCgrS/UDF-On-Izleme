name: Sınama
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sinama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node araclar/paketle.mjs
